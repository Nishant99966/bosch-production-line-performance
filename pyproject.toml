[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bosch-production-line-performance"
version = "0.1.0"
description = "Memory-aware end-to-end ML pipeline for the Kaggle Bosch Production Line Performance competition"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Nishant Tyagi"}]
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.1,<3",
  "pyarrow>=15,<20",
  "scikit-learn>=1.4,<2",
  "lightgbm>=4.3,<5",
  "PyYAML>=6,<7",
  "joblib>=1.3,<2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
