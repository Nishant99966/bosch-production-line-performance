paths:
  raw_dir: data/raw_synthetic
  processed_dir: data/processed_synthetic
  artifacts_dir: artifacts_synthetic
io:
  chunk_size: 500
features:
  numeric_top_k: 12
  include_categorical: true
  categorical_top_k: 5
  min_numeric_coverage: 0.0
  min_categorical_coverage: 0.0
validation:
  strategy: stratified
  validation_fraction: 0.25
  random_state: 42
model:
  n_estimators: 120
  learning_rate: 0.05
  num_leaves: 15
  max_depth: -1
  min_child_samples: 15
  subsample: 0.9
  colsample_bytree: 0.9
  reg_alpha: 0.0
  reg_lambda: 0.5
  random_state: 42
  n_jobs: 2
  early_stopping_rounds: 20
